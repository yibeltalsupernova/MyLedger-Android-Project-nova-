name: MyLedger Signed Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.MYLEDGER_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > myledger-release.jks

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/myledger-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.MYLEDGER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYLEDGER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MYLEDGER_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLedger-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Delete signing key
        if: always()
        run: rm -f myledger-release.jks
